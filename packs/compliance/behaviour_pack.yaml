pack:
  id: compliance-intelligence
  name: Compliance Intelligence
  version: 1.0.0
  domain: compliance
  description: Learn your compliance team's review patterns

entities:
  - name: finding
    fields:
      - text: text
      - severity: string
      - regulation: string
      - remediation: text

events:
  - name: compliance_review
    fields:
      - finding_id: string
      - decision: string
      - reviewer_id: integer
      - time_spent: integer

policies:
  - name: high_severity_escalate
    triggers: ["critical", "high", "severe", "material"]
    actions:
      - action: escalate
        severity: high
    confidence_threshold: 0.7

  - name: regulation_reference
    triggers: ["gdpr", "hipaa", "soc2", "iso27001"]
    actions:
      - action: flag
        severity: medium
    confidence_threshold: 0.6
