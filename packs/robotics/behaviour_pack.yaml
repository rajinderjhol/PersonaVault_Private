# Robotics Intelligence Behaviour Pack
# Enables robots with memory, personality, and explainable decision-making

pack:
  id: robotics-intelligence
  name: Robotics Intelligence
  version: 1.0.0
  domain: robotics
  description: |
    Give your robots memory, personality, and explainable decision-making.
    Learn from every interaction, adapt to each user, and explain every action.

# ============ ENTITIES ============
entities:
  - name: user
    description: A human user interacting with the robot
    fields:
      - name: user_id
        type: string
        required: true
      - name: name
        type: string
      - name: age
        type: integer
      - name: preferences
        type: array
        items: string
      - name: interaction_count
        type: integer
        default: 0
      - name: trust_score
        type: float
        min: 0.0
        max: 1.0
        default: 0.5
      - name: personality_traits
        type: object
        fields:
          - extraversion: float
          - agreeableness: float
          - conscientiousness: float
          - neuroticism: float
          - openness: float
      - name: medical_conditions
        type: array
        items: string
      - name: mobility_restrictions
        type: array
        items: string
      - name: communication_preferences
        type: array
        items: string

  - name: environment
    description: The robot's environment context
    fields:
      - name: location
        type: string
      - name: lighting
        type: string
        enum: [bright, dim, dark]
      - name: noise_level
        type: string
        enum: [quiet, moderate, loud]
      - name: occupancy
        type: string
        enum: [empty, few, crowded]
      - name: temperature
        type: float
      - name: hazards
        type: array
        items: string
      - name: time_of_day
        type: string
        enum: [morning, afternoon, evening, night]

  - name: action
    description: A robot action or decision
    fields:
      - name: action_type
        type: string
        enum: [navigate, manipulate, communicate, assist, monitor, alert]
      - name: action_description
        type: string
      - name: success
        type: boolean
      - name: execution_time
        type: float
      - name: energy_consumed
        type: float
      - name: safety_checks_passed
        type: array
        items: string

  - name: safety_event
    description: A safety-related event
    fields:
      - name: event_type
        type: string
        enum: [obstacle_detected, human_proximity, hazardous_condition, malfunction, emergency_stop]
      - name: severity
        type: string
        enum: [low, medium, high, critical]
      - name: detection_time
        type: float
      - name: response_time
        type: float
      - name: action_taken
        type: string
      - name: outcome
        type: string
        enum: [resolved, escalated, user_notified, emergency_protocol]

  - name: conversation
    description: A human-robot conversation
    fields:
      - name: topic
        type: string
      - name: duration
        type: float
      - name: sentiment
        type: float
        min: -1.0
        max: 1.0
      - name: engagement_level
        type: float
        min: 0.0
        max: 1.0
      - name: key_points
        type: array
        items: string

# ============ EVENTS ============
events:
  - name: robot_decision
    description: A robot making a decision
    fields:
      - name: decision_type
        type: string
        required: true
      - name: context
        type: string
        required: true
      - name: options_considered
        type: array
        items: string
      - name: selected_option
        type: string
        required: true
      - name: reasoning
        type: string
        required: true
      - name: confidence
        type: float
        min: 0.0
        max: 1.0
      - name: human_override
        type: boolean
        default: false
      - name: override_reason
        type: string

  - name: user_interaction
    description: An interaction between a robot and a user
    fields:
      - name: interaction_type
        type: string
        required: true
      - name: user_id
        type: string
        required: true
      - name: duration
        type: float
      - name: user_satisfaction
        type: float
        min: 0.0
        max: 1.0
      - name: robot_adaptation
        type: string
      - name: repeated_interaction
        type: boolean

  - name: safety_alert
    description: A safety alert generated by the robot
    fields:
      - name: alert_type
        type: string
        required: true
      - name: severity
        type: string
        required: true
      - name: timestamp
        type: datetime
        required: true
      - name: location
        type: string
        required: true
      - name: description
        type: string
        required: true
      - name: recommended_action
        type: string
      - name: acknowledged
        type: boolean
        default: false
      - name: acknowledged_by
        type: string

  - name: task_execution
    description: A robot executing a task
    fields:
      - name: task_type
        type: string
        required: true
      - name: task_description
        type: string
        required: true
      - name: duration
        type: float
      - name: success
        type: boolean
        required: true
      - name: obstacles_encountered
        type: array
        items: string
      - name: human_intervention
        type: boolean
        default: false
      - name: intervention_reason
        type: string

  - name: user_profile_update
    description: An update to a user's profile
    fields:
      - name: user_id
        type: string
        required: true
      - name: updated_fields
        type: array
        items: string
      - name: confidence
        type: float
        min: 0.0
        max: 1.0
      - name: evidence
        type: string

# ============ DECISION TYPES ============
decision_types:
  - id: navigate
    label: Navigate
    description: Navigate to a location
  - id: interact
    label: Interact
    description: Interact with a user
  - id: assist
    label: Assist
    description: Assist with a task
  - id: monitor
    label: Monitor
    description: Monitor an environment or user
  - id: alert
    label: Alert
    description: Generate an alert
  - id: emergency_stop
    label: Emergency Stop
    description: Perform an emergency stop
  - id: learn
    label: Learn
    description: Learn from interaction

# ============ METRICS ============
metrics:
  - id: user_trust
    label: User Trust Score
    description: Average trust score across users
    target: "> 0.8"
    unit: percent
    good: higher

  - id: interaction_satisfaction
    label: Interaction Satisfaction
    description: Average user satisfaction across interactions
    target: "> 0.8"
    unit: percent
    good: higher

  - id: safety_response_time
    label: Safety Response Time
    description: Average time to respond to safety events
    target: "< 2"
    unit: seconds
    good: lower

  - id: task_success_rate
    label: Task Success Rate
    description: Percentage of tasks completed successfully
    target: "> 90"
    unit: percent
    good: higher

  - id: human_intervention_rate
    label: Human Intervention Rate
    description: Percentage of tasks requiring human intervention
    target: "< 10"
    unit: percent
    good: lower

  - id: personalization_accuracy
    label: Personalization Accuracy
    description: Accuracy of user preference prediction
    target: "> 85"
    unit: percent
    good: higher

# ============ POLICIES ============
policies:
  # Safety Policies
  - name: safety_priority
    description: Safety always takes priority over task completion
    triggers:
      - safety_event.severity == "critical"
      - safety_event.severity == "high"
    actions:
      - action: emergency_stop
        priority: highest
      - action: alert
        recipients: [human_operator, safety_officer]
    confidence_threshold: 0.95

  - name: human_proximity_safety
    description: Maintain safe distance from humans
    triggers:
      - environment.occupancy == "crowded"
      - human_proximity_detected
    actions:
      - action: slow_down
      - action: caution_mode
    confidence_threshold: 0.85

  - name: user_preference_learning
    description: Learn and adapt to user preferences
    triggers:
      - user_interaction.duration > 60
      - repeated_interaction == true
    actions:
      - action: update_profile
      - action: personalize_behavior
    confidence_threshold: 0.7

  - name: emergency_stop_protocol
    description: Emergency stop when hazardous conditions detected
    triggers:
      - safety_event.severity == "critical"
      - environment.hazards contains "fire" or "chemical"
    actions:
      - action: emergency_stop
      - action: notify_emergency_services
      - action: evacuate_area
    confidence_threshold: 0.98

  - name: trust_building
    description: Build trust through consistent, positive interactions
    triggers:
      - user.trust_score < 0.6
      - interaction_count > 10
    actions:
      - action: increase_transparency
      - action: explain_decisions
      - action: offer_control
    confidence_threshold: 0.6

  - name: behavioral_anomaly_detection
    description: Detect unusual user behavior patterns
    triggers:
      - user_interaction.frequency > 3 * avg
      - user_interaction.sentiment < -0.5
    actions:
      - action: flag_review
      - action: notify_caregiver
    confidence_threshold: 0.75

  - name: energy_optimization
    description: Optimize energy usage during tasks
    triggers:
      - action.energy_consumed > optimal_energy
      - action.execution_time > 2 * avg
    actions:
      - action: optimize_route
      - action: adjust_speed
    confidence_threshold: 0.65

  - name: adaptive_communication
    description: Adapt communication style to user preferences
    triggers:
      - user.communication_preferences != current_style
    actions:
      - action: adjust_tone
      - action: adjust_pace
      - action: adjust_verbosity
    confidence_threshold: 0.7

# ============ EVALUATION RULES ============
evaluation_rules:
  - metric: user_trust
    success_condition: "> 0.8"
    failure_condition: "< 0.5"
  
  - metric: interaction_satisfaction
    success_condition: "> 0.8"
    failure_condition: "< 0.5"
  
  - metric: safety_response_time
    success_condition: "< 2"
    failure_condition: "> 5"
  
  - metric: task_success_rate
    success_condition: "> 90"
    failure_condition: "< 70"
  
  - metric: human_intervention_rate
    success_condition: "< 10"
    failure_condition: "> 30"
  
  - metric: personalization_accuracy
    success_condition: "> 85"
    failure_condition: "< 60"

# ============ DASHBOARD VIEWS ============
views:
  - name: Robot Operations Dashboard
    description: Real-time robot operations monitoring
    metrics:
      - task_success_rate
      - safety_response_time
      - human_intervention_rate
  
  - name: Human-Robot Interaction Dashboard
    description: User interaction analytics
    metrics:
      - user_trust
      - interaction_satisfaction
      - personalization_accuracy
  
  - name: Safety Dashboard
    description: Safety monitoring and alerts
    metrics:
      - safety_response_time
      - task_success_rate

# ============ WORKFLOW ============
workflow:
  - step: sense
    description: Sense environment and user state
  - step: plan
    description: Plan appropriate action
  - step: decide
    description: Make decision
  - step: act
    description: Execute action
  - step: learn
    description: Learn from outcome

# ============ ROLES ============
roles:
  - name: robot_operator
    permissions: [monitor, override, review_logs]
  
  - name: safety_officer
    permissions: [review_safety_events, approve_actions, override_emergency]
  
  - name: caregiver
    permissions: [view_user_data, set_preferences, receive_alerts]
  
  - name: system_administrator
    permissions: [configure_policies, manage_users, full_access]
