pack:
  id: security-intelligence
  name: Security Intelligence
  version: 1.0.0
  domain: security
  description: Learn your SOC team's incident response patterns
  focus:
    - threat detection
    - incident response
    - vulnerability assessment
  keywords:
    - security
    - incident
    - threat
    - breach
    - vulnerability
    - attack
    - malware
  actions:
    - block_ip
    - alert_security_team
    - investigate_incident
    - update_firewall
  patterns:
    - failed_login_attempts
    - suspicious_traffic
    - unauthorized_access
  rules:
    - if: failed_login_attempts > 5 in 1 minute
      then: block_ip
    - if: suspicious_traffic detected
      then: alert_security_team

entities:
  - name: incident
    fields:
      - type: string
      - severity: string
      - investigation_steps: array
      - resolution: string

events:
  - name: incident_response
    fields:
      - incident_id: string
      - decision: string
      - analyst_id: integer
      - time_to_resolve: integer

policies:
  - name: critical_incident_escalate
    triggers: ["critical", "p1", "breach", "ransomware"]
    actions:
      - action: escalate
        team: "SOC Lead"
    confidence_threshold: 0.8

  - name: phishing_quarantine
    triggers: ["phishing", "suspicious email", "malware"]
    actions:
      - action: quarantine
        time: "immediate"
    confidence_threshold: 0.7
