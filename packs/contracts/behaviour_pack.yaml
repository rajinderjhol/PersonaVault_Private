# Contract Intelligence Behaviour Pack
# Learn your legal team's review patterns

pack:
  id: contract-intelligence
  name: Contract Intelligence
  version: 1.0.0
  domain: legal
  description: Learn your legal team's review patterns and improve contract review speed and accuracy.

entities:
  - name: contract_type
    description: Types of contracts
    examples:
      - Employment Agreement
      - Service Agreement
      - Non-Disclosure Agreement (NDA)
      - Master Service Agreement (MSA)
      - Statement of Work (SOW)
      - Partnership Agreement
      - Licensing Agreement
      - Lease Agreement

  - name: key_clause
    description: Key contract clauses to review
    examples:
      - Indemnification
      - Limitation of Liability
      - Termination
      - Force Majeure
      - Governing Law
      - Dispute Resolution
      - Confidentiality
      - Payment Terms
      - Intellectual Property Rights

  - name: red_flag
    description: Common contract red flags
    examples:
      - Unlimited liability
      - Automatic renewal without notice
      - One-sided indemnification
      - Unreasonable termination penalties
      - Vague scope of work
      - Missing termination for convenience
      - Non-compete restrictions
      - Jurisdiction outside home country

events:
  - name: contract_review
    description: A contract review event
    fields:
      - name: contract_id
        type: string
        required: true
      - name: reviewer_id
        type: string
        required: true
      - name: time_spent
        type: integer
        unit: minutes
      - name: clauses_reviewed
        type: integer
      - name: clauses_flagged
        type: integer
      - name: risk_score
        type: float
        range: [0, 10]
  
  - name: negotiation
    description: Contract negotiation event
    fields:
      - name: contract_id
        type: string
        required: true
      - name: rounds
        type: integer
      - name: changes_made
        type: integer
      - name: time_to_close
        type: integer
        unit: days

decision_types:
  - id: approve
    label: Approve
    description: Accept the contract as-is
    risk_threshold: low
  
  - id: flag
    label: Flag for Review
    description: Flag the contract for legal review
    risk_threshold: medium
  
  - id: negotiate
    label: Negotiate
    description: Request changes to the contract
    risk_threshold: high
  
  - id: reject
    label: Reject
    description: Reject the contract
    risk_threshold: critical

metrics:
  - id: review_time
    label: Review Time
    description: Average time to review a contract
    target: "< 30"
    unit: minutes
    good: lower
  
  - id: flag_rate
    label: Flag Rate
    description: Percentage of contracts flagged for review
    target: "< 20%"
    unit: percent
    good: lower
  
  - id: risk_reduction
    label: Risk Reduction
    description: Reduction in contract risk over time
    target: "> 20%"
    unit: percent
    good: higher

policies:
  - name: unlimited_liability
    description: Flag contracts with unlimited liability
    triggers:
      - unlimited liability
      - no cap
      - without limit
    actions:
      - action: reject
        severity: high
        message: "Unlimited liability is a critical risk. This should be capped."
    confidence_threshold: 0.8
  
  - name: automatic_renewal
    description: Flag automatic renewal clauses
    triggers:
      - automatic renewal
      - auto-renew
      - renew automatically
    actions:
      - action: flag
        severity: medium
        message: "Check automatic renewal notice period. Ensure you can opt out."
    confidence_threshold: 0.7
  
  - name: indemnification
    description: Review indemnification clauses
    triggers:
      - indemnify
      - hold harmless
      - indemnification
    actions:
      - action: flag
        severity: medium
        message: "Review indemnification scope. Ensure it's reciprocal."
    confidence_threshold: 0.6

evaluation_rules:
  - metric: review_time
    success_condition: "< 30"
    failure_condition: "> 60"
  
  - metric: flag_rate
    success_condition: "< 20%"
    failure_condition: "> 40%"
  
  - metric: risk_reduction
    success_condition: "> 20%"
    failure_condition: "< 10%"
