<div id="replay-tab">
    <h2 style="color: var(--accent);">🔄 Decision Replay</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Replay any decision at any point in time to see how policies would have changed.
    </p>
    
    <div class="card" style="margin-bottom:20px;">
        <div style="display:flex; gap:10px;">
            <input type="number" id="replay-event-id" placeholder="Event ID" class="input-field" style="flex:1;">
            <button class="btn" onclick="startReplay()"><i class="fas fa-play"></i> Replay</button>
        </div>
    </div>
    
    <div id="replay-container" style="display:none;">
        <!-- Timeline View -->
        <div class="card" style="border-top: 4px solid #38bdf8; margin-bottom:20px;">
            <div class="flex-between">
                <h3 class="card-title">⏱️ Decision Timeline</h3>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn" style="padding:4px 12px; background:#334155;" onclick="setReplaySpeed(0.5)">0.5x</button>
                    <button class="btn" style="padding:4px 12px; background:#334155;" onclick="setReplaySpeed(1)">1x</button>
                    <button class="btn" style="padding:4px 12px; background:#334155;" onclick="setReplaySpeed(2)">2x</button>
                    <button class="btn" style="padding:4px 12px; background:#334155;" onclick="setReplaySpeed(4)">4x</button>
                    <span id="replay-speed-label" style="color:#94a3b8; font-size:12px;">Speed: 1x</span>
                    <button class="btn" id="btn-replay-control" style="padding:4px 12px; background:#38bdf8;" onclick="toggleReplayPlay()">
                        <i class="fas fa-pause"></i>
                    </button>
                </div>
            </div>
            <div id="replay-timeline" style="margin-top:20px; position:relative; padding-left:30px;"></div>
        </div>
        
        <!-- Decision Details -->
        <div class="card" style="border-top: 4px solid #34d399;">
            <h3 class="card-title">📊 Decision Analysis</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:15px;">
                <div id="replay-original">
                    <div class="metric-label">Original Decision</div>
                    <div id="replay-original-content"></div>
                </div>
                <div id="replay-current">
                    <div class="metric-label">Current Decision</div>
                    <div id="replay-current-content"></div>
                </div>
            </div>
            <div id="replay-comparison" style="margin-top:15px;"></div>
        </div>
        
        <!-- JSON Raw -->
        <div class="card" style="border-top: 4px solid #64748b; margin-top:20px;">
            <h3 class="card-title">📄 Raw Data</h3>
            <pre id="replay-raw" style="background:#020617; padding:15px; border-radius:8px; color:var(--accent); border:1px solid var(--border); max-height:200px; overflow:auto; font-size:11px;"></pre>
        </div>
    </div>
</div>

<script>
// ============ DECISION REPLAY - GLOBAL FUNCTIONS ============
// Make all functions globally accessible
window.replayData = null;
window.replayStep = 0;
window.replayInterval = null;
window.replaySpeed = 1;
window.isReplaying = false;

window.setReplaySpeed = function(speed) {
    window.replaySpeed = speed;
    const label = document.getElementById('replay-speed-label');
    if (label) label.textContent = `Speed: ${speed}x`;
    if (window.isReplaying) {
        clearInterval(window.replayInterval);
        window.startReplayInterval();
    }
};

window.toggleReplayPlay = function() {
    if (window.isReplaying) {
        window.pauseReplay();
    } else {
        window.resumeReplay();
    }
};

window.pauseReplay = function() {
    window.isReplaying = false;
    clearInterval(window.replayInterval);
    const btn = document.getElementById('btn-replay-control');
    if (btn) btn.innerHTML = '<i class="fas fa-play"></i>';
};

window.resumeReplay = function() {
    if (!window.replayData) return;
    window.isReplaying = true;
    const btn = document.getElementById('btn-replay-control');
    if (btn) btn.innerHTML = '<i class="fas fa-pause"></i>';
    window.startReplayInterval();
};

window.startReplayInterval = function() {
    if (window.replayInterval) clearInterval(window.replayInterval);
    window.replayInterval = setInterval(() => {
        const steps = window.replayData?.timeline || [];
        if (window.replayStep >= steps.length) {
            window.pauseReplay();
            const btn = document.getElementById('btn-replay-control');
            if (btn) btn.innerHTML = '<i class="fas fa-redo"></i>';
            return;
        }
        window.renderReplayStep(window.replayStep);
        window.replayStep++;
    }, 800 / window.replaySpeed);
};

window.renderReplayStep = function(stepIndex) {
    const steps = document.querySelectorAll('.replay-step');
    steps.forEach((el, i) => {
        el.style.opacity = i <= stepIndex ? '1' : '0.3';
        if (i === stepIndex) {
            el.style.background = 'rgba(56, 189, 248, 0.05)';
            el.style.borderLeft = '3px solid #38bdf8';
            el.style.paddingLeft = '12px';
            el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } else {
            el.style.background = 'transparent';
            el.style.borderLeft = 'none';
            el.style.paddingLeft = '0';
        }
    });
};

window.startReplay = async function() {
    const id = document.getElementById('replay-event-id').value;
    if (!id) { 
        if (window.showToast) window.showToast('Enter an Event ID', 'error');
        return; 
    }
    
    const container = document.getElementById('replay-container');
    const timeline = document.getElementById('replay-timeline');
    const raw = document.getElementById('replay-raw');
    
    container.style.display = 'block';
    timeline.innerHTML = '<div class="metric-label">Loading replay data...</div>';
    
    try {
        const res = await fetch(`/api/v1/timeline/replay/${id}`);
        const data = await res.json();
        window.replayData = data;
        window.replayStep = 0;
        
        // Build timeline from data
        const steps = data.timeline || [];
        if (steps.length === 0) {
            timeline.innerHTML = '<div class="metric-label" style="color:#f87171;">No timeline data available</div>';
            return;
        }
        
        // Display original and current
        document.getElementById('replay-original-content').innerHTML = `
            <div style="padding:10px; background:#020617; border-radius:8px; margin-top:5px;">
                <div style="font-weight:700; color:#38bdf8;">${data.original_decision?.decision || 'Unknown'}</div>
                <div style="font-size:12px; color:#94a3b8;">Confidence: ${((data.original_decision?.confidence || 0) * 100).toFixed(0)}%</div>
                <div style="font-size:12px; color:#94a3b8;">${data.original_decision?.reason || ''}</div>
            </div>
        `;
        
        document.getElementById('replay-current-content').innerHTML = `
            <div style="padding:10px; background:#020617; border-radius:8px; margin-top:5px;">
                <div style="font-weight:700; color:${data.analysis?.would_decision_change ? '#f87171' : '#34d399'}">
                    ${data.analysis?.would_decision_change ? '⚠️ Would Change' : '✅ Consistent'}
                </div>
                <div style="font-size:12px; color:#94a3b8;">${data.analysis?.reason_changed || 'No change needed'}</div>
            </div>
        `;
        
        // Comparison result
        document.getElementById('replay-comparison').innerHTML = `
            <div style="padding:12px; background:#020617; border-radius:8px; border-left:4px solid ${data.analysis?.would_decision_change ? '#f87171' : '#34d399'};">
                <div style="font-weight:700; color:${data.analysis?.would_decision_change ? '#f87171' : '#34d399'};">
                    ${data.analysis?.would_decision_change ? '❌ Decision would change with current policies' : '✅ Decision remains consistent with current policies'}
                </div>
                <div style="font-size:12px; color:#94a3b8; margin-top:5px;">
                    Policies applied: ${data.analysis?.policies_at_time?.join(', ') || 'None'}
                </div>
            </div>
        `;
        
        // Raw data
        raw.textContent = JSON.stringify(data, null, 2);
        
        // Build visual timeline
        timeline.innerHTML = window.buildTimelineHTML(steps);
        
        // Auto-play
        window.replayStep = 0;
        window.isReplaying = true;
        const btn = document.getElementById('btn-replay-control');
        if (btn) btn.innerHTML = '<i class="fas fa-pause"></i>';
        window.startReplayInterval();
        
        if (window.showToast) window.showToast('Replay started', 'success');
    } catch (e) {
        timeline.innerHTML = `<div class="metric-label" style="color:#f87171;">Error: ${e.message}</div>`;
        if (window.showToast) window.showToast('Replay failed', 'error');
    }
};

window.buildTimelineHTML = function(steps) {
    let html = '';
    steps.forEach((step, index) => {
        const icons = {
            'detection': '🔍',
            'policy_match': '📋',
            'ai_recommendation': '🤖',
            'decision': '👤',
            'audit': '🔒',
            'learning': '📚'
        };
        const colors = {
            'detection': '#38bdf8',
            'policy_match': '#fbbf24',
            'ai_recommendation': '#a855f7',
            'decision': '#34d399',
            'audit': '#f87171',
            'learning': '#f472b6'
        };
        const icon = icons[step.type] || '•';
        const color = colors[step.type] || '#94a3b8';
        html += `
            <div class="replay-step" data-step="${index}" style="opacity: ${index === 0 ? '1' : '0.3'}; transition: all 0.5s ease; padding:12px 0; border-bottom: 1px solid #1e293b;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="font-size:20px;">${icon}</span>
                    <div style="flex:1;">
                        <div style="font-weight:700; color:${color};">${step.label}</div>
                        <div style="font-size:12px; color:#94a3b8;">${step.description}</div>
                    </div>
                    ${step.confidence ? `<span style="font-size:11px; color:#fbbf24;">${(step.confidence * 100).toFixed(0)}%</span>` : ''}
                    <span style="font-size:10px; color:#64748b;">${step.timestamp ? new Date(step.timestamp).toLocaleTimeString() : ''}</span>
                </div>
            </div>
        `;
    });
    return html;
};
</script>
