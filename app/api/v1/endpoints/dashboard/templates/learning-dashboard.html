
<div id="learning-dashboard-tab">
    <h2 style="color: var(--accent);">📊 Learning Dashboard</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Visualize pattern extraction, learning progress, and system intelligence growth.
    </p>
    
    <!-- Learning Metrics -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <div class="card" style="border-top: 4px solid #a855f7;">
            <div class="metric-label">Total Patterns</div>
            <div id="learning-total-patterns" class="metric-value" style="font-size: 28px; color: #a855f7;">0</div>
        </div>
        <div class="card" style="border-top: 4px solid #34d399;">
            <div class="metric-label">Active Patterns</div>
            <div id="learning-active-patterns" class="metric-value" style="font-size: 28px; color: #34d399;">0</div>
        </div>
        <div class="card" style="border-top: 4px solid #fbbf24;">
            <div class="metric-label">Success Rate</div>
            <div id="learning-success-rate" class="metric-value" style="font-size: 28px; color: #fbbf24;">0%</div>
        </div>
        <div class="card" style="border-top: 4px solid #38bdf8;">
            <div class="metric-label">Learning Progress</div>
            <div id="learning-progress" class="metric-value" style="font-size: 28px; color: #38bdf8;">0%</div>
        </div>
    </div>
    
    <!-- Pattern Feed -->
    <div class="card" style="border-top: 4px solid #38bdf8; margin-bottom: 20px;">
        <h3 class="card-title">📜 Pattern Extraction Feed</h3>
        <div id="pattern-feed" style="max-height: 300px; overflow-y: auto;">
            <div class="metric-label">No patterns extracted yet. Send more messages to start learning!</div>
        </div>
    </div>
    
    <!-- Confidence Trends -->
    <div class="card" style="border-top: 4px solid #f472b6;">
        <h3 class="card-title">📈 Confidence Trends</h3>
        <canvas id="confidence-chart" style="max-height: 200px; width: 100%;"></canvas>
    </div>
</div>

<script>
// ============ LEARNING DASHBOARD ============
async function loadLearningDashboard() {
    try {
        const res = await fetch("/api/v1/learning/stats");
        if (!res.ok) throw new Error("Failed to fetch learning stats");
        const data = await res.json();
        
        document.getElementById("learning-total-patterns").textContent = data.total_patterns || 0;
        document.getElementById("learning-active-patterns").textContent = data.active_patterns || 0;
        document.getElementById("learning-success-rate").textContent = (data.success_rate || 0).toFixed(1) + "%";
        document.getElementById("learning-progress").textContent = (data.progress || 0).toFixed(1) + "%";
        
        const feed = document.getElementById("pattern-feed");
        if (data.patterns && data.patterns.length > 0) {
            feed.innerHTML = data.patterns.map(function(p) {
                let color = p.weight > 0.7 ? "#34d399" : p.weight > 0.4 ? "#fbbf24" : "#f87171";
                return `<div style="padding: 10px; background: #020617; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid ${color};">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: #38bdf8; font-weight: 600;">${p.type || "Unknown"}</span>
                        <span style="color: #94a3b8; font-size: 11px;">Weight: ${(p.weight || 0).toFixed(2)}</span>
                        <span class="tag ${p.is_active ? "tag-success" : "tag-danger"}" style="font-size: 9px; padding: 2px 6px;">${p.is_active ? "Active" : "Inactive"}</span>
                    </div>
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Trigger: ${p.trigger || "N/A"}</div>
                    <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Correction: ${p.correction || "N/A"}</div>
                </div>`;
            }).join("");
        } else {
            feed.innerHTML = "<div class=\"metric-label\">No patterns extracted yet. Send more messages to start learning!</div>";
        }
        
        if (data.confidence_history && data.confidence_history.length > 0) {
            renderConfidenceChart(data.confidence_history);
        }
    } catch (e) {
        console.error("Learning dashboard error:", e);
        document.getElementById("pattern-feed").innerHTML = "<div class=\"metric-label\" style=\"color: #f87171;\">Error loading learning data</div>";
    }
}

function renderConfidenceChart(history) {
    const ctx = document.getElementById("confidence-chart");
    if (!ctx) return;
    
    if (window._confidenceChart) window._confidenceChart.destroy();
    
    window._confidenceChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: history.map(function(_, i) { return (i + 1); }),
            datasets: [{
                label: "Confidence",
                data: history,
                borderColor: "#f472b6",
                backgroundColor: "rgba(244, 114, 182, 0.1)",
                fill: true,
                tension: 0.3,
                pointBackgroundColor: history.map(function(c) { return c > 0.7 ? "#34d399" : c > 0.4 ? "#fbbf24" : "#f87171"; })
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: { legend: { labels: { color: "#94a3b8" } } },
            scales: {
                x: { ticks: { color: "#64748b", maxTicksLimit: 10 }, grid: { color: "#1e293b" } },
                y: { min: 0, max: 1, ticks: { color: "#64748b", callback: function(value) { return (value * 100) + "%"; } }, grid: { color: "#1e293b" } }
            }
        }
    });
}
setTimeout(loadLearningDashboard, 500);
</script>
