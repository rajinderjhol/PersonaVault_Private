<div id="packs-tab">
    <h2 style="color: var(--accent);">📦 Domain Intelligence Packs</h2>
    
    <div id="packs-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
        <!-- Packs will be dynamically loaded here -->
    </div>
    
    <div class="card" style="margin-top: 20px; border-top: 4px solid var(--accent);">
        <h3 class="card-title">📥 Install New Pack</h3>
        <p style="color: #94a3b8; font-size: 13px;">Upload a behaviour_pack.yaml file</p>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="file" id="pack-file-input" accept=".yaml,.yml" class="input-field" style="flex: 1;">
            <button class="btn" style="background: var(--accent);" onclick="installPack()">
                <i class="fas fa-download"></i> Install Pack
            </button>
        </div>
        <div id="pack-install-status" style="margin-top:15px; font-family:monospace; font-size:11px; color:#fbbf24;"></div>
    </div>
</div>

<script>
    async function fetchPacks() {
        const grid = document.getElementById('packs-grid');
        if (!grid) return;
        grid.innerHTML = '<div class="metric-label">Loading packs...</div>';
        try {
            const res = await fetch('/api/v1/packs/');
            const data = await res.json();
            const packs = data.packs || [];
            
            if (packs.length > 0) {
                grid.innerHTML = packs.map(p => `
                    <div class="pack-card" style="background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid ${p.is_active ? '#34d399' : '#f87171'};">
                        <div style="display:flex;justify-content:space-between; align-items: center; margin-bottom: 10px;">
                            <span class="pack-name" style="font-weight:700; color:#38bdf8;">${p.name}</span>
                            <span class="tag ${p.is_active ? 'tag-success' : 'tag-danger'}">${p.is_active ? 'Active' : 'Inactive'}</span>
                        </div>
                        <div class="pack-stats" style="color:#94a3b8; font-size: 12px; margin-bottom: 10px;">Domain: ${p.domain} | Version: ${p.version}</div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn" style="background: ${p.is_active ? '#fbbf24' : '#34d399'}; padding: 5px 10px; font-size: 11px;" onclick="togglePack('${p.id}')">
                                ${p.is_active ? 'Deactivate' : 'Activate'}
                            </button>
                            <button class="btn" style="background: #f87171; padding: 5px 10px; font-size: 11px;" onclick="removePack('${p.id}')">
                                Remove
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.innerHTML = '<div class="metric-label">No packs installed</div>';
            }
        } catch (e) { grid.innerHTML = '<div class="metric-label">Error loading packs</div>'; }
    }

    async function togglePack(id) {
        try {
            const res = await fetch(`/api/v1/packs/${id}/toggle`, {method: 'POST'});
            if (res.ok) {
                showToast('Pack status updated', 'success');
                fetchPacks();
            } else {
                throw new Error('Failed to toggle pack');
            }
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function removePack(id) {
        if (!confirm('Are you sure you want to remove this pack?')) return;
        try {
            const res = await fetch(`/api/v1/packs/${id}`, {method: 'DELETE'});
            if (res.ok) {
                showToast('Pack removed', 'success');
                fetchPacks();
            } else {
                throw new Error('Failed to remove pack');
            }
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }
</script>
