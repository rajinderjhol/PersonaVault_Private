<div id="overview-tab">
    <h2 style="color: var(--accent);">📊 System Overview</h2>
    
    <!-- System Health -->
    <div class="card" style="margin-bottom: 20px;">
        <h3 class="card-title">🚦 System Health</h3>
        <div class="health-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
            <div class="health-item" style="background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #1e293b;">
                <span style="color: #94a3b8; font-size: 12px;">Database</span>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <span style="color: #34d399;">🟢</span>
                    <span style="color: #f1f5f9;">Connected</span>
                </div>
            </div>
            <div class="health-item" style="background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #1e293b;">
                <span style="color: #94a3b8; font-size: 12px;">Vector Store</span>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <span style="color: #34d399;">🟢</span>
                    <span style="color: #f1f5f9;" id="vector-count">0 entries</span>
                </div>
            </div>
            <div class="health-item" style="background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #1e293b;">
                <span style="color: #94a3b8; font-size: 12px;">WebSocket</span>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <span style="color: #34d399;">🟢</span>
                    <span style="color: #f1f5f9;">Active</span>
                </div>
            </div>
            <div class="health-item" style="background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #1e293b;">
                <span style="color: #94a3b8; font-size: 12px;">AI Service</span>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <span style="color: #34d399;">🟢</span>
                    <span style="color: #f1f5f9;" id="ai-service-status">Connected</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Metrics Grid -->
    <div id="metrics-grid" class="grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;"></div>
    
    <!-- Quick Stats -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px;">
        <div class="card">
            <div class="metric-label">📈 Total Events</div>
            <div class="metric-value" id="stat-total-events">0</div>
        </div>
        <div class="card">
            <div class="metric-label">🎯 Avg Confidence</div>
            <div class="metric-value" id="stat-avg-confidence">0%</div>
        </div>
        <div class="card">
            <div class="metric-label">📦 Active Models</div>
            <div class="metric-value" id="stat-active-models">0</div>
        </div>
        <div class="card">
            <div class="metric-label">🧠 Domains</div>
            <div class="metric-value" id="stat-domains">0</div>
        </div>
    </div>
    
    <!-- Raw Metrics -->
    <div class="card">
        <h3 class="card-title">📡 Raw System Metrics</h3>
        <pre id="raw-metrics" style="background: #020617; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 300px; overflow-y: auto;">Initializing...</pre>
        <button class="refresh-btn" onclick="fetchMetrics()" style="margin-top: 10px;"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
</div>

<style>
.card { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #1e293b; }
.card-title { color: #f1f5f9; font-size: 16px; margin: 0 0 15px 0; }
.metric-label { color: #94a3b8; font-size: 12px; }
.metric-value { color: #f1f5f9; font-size: 28px; font-weight: 700; margin-top: 4px; }
.health-item:hover { border-color: #38bdf8; transition: border-color 0.3s; }
</style>
