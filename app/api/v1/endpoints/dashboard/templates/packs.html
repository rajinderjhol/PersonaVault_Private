<div id="packs-tab">
    <h2 style="color: var(--accent);">📦 Domain Intelligence Pack Management</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h3 class="card-title" style="color: #f87171;">❌ Inactive Packs</h3>
            <div id="inactive-packs-list"></div>
            <button class="btn" style="background: #34d399; width: 100%; margin-top: 10px;" onclick="bulkTogglePacks(false)">Deactivate All</button>
        </div>
        <div class="card">
            <h3 class="card-title" style="color: #34d399;">✅ Active Packs</h3>
            <div id="active-packs-list"></div>
            <button class="btn" style="background: #fbbf24; width: 100%; margin-top: 10px;" onclick="bulkTogglePacks(true)">Activate All</button>
        </div>
    </div>
    
    <div class="card" style="margin-top: 20px; border-top: 4px solid var(--accent);">
        <h3 class="card-title">📥 Install New Pack</h3>
        <input type="file" id="pack-file-input" accept=".yaml,.yml" class="input-field">
        <button class="btn" onclick="installPack()">Install Pack</button>
        <div id="pack-install-status" style="margin-top:10px;"></div>
    </div>
</div>
