<!-- Evidence Dashboard Widget -->
<div id="evidence-widget" class="card" style="border-top: 4px solid #a855f7; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 class="card-title" style="color: #a855f7;">
            📋 Decision Evidence Pipeline
            <span id="evidence-count" class="tag tag-info" style="font-size: 10px; margin-left: 8px;">0</span>
        </h3>
        <div style="display: flex; gap: 8px;">
            <button class="btn" style="padding: 2px 10px; font-size: 10px; background: #1e293b;" onclick="window.uploadEvidence()">
                <i class="fas fa-upload"></i> Upload
            </button>
            <button class="refresh-btn" onclick="window.loadEvidenceStats()" style="padding: 2px 8px; font-size: 10px;">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>
    
    <div id="evidence-stats-container" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px;">
        <div style="background: #020617; padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 11px; color: #94a3b8;">Total Blocks</div>
            <div id="ev-total" style="font-size: 20px; font-weight: 700; color: #f1f5f9;">0</div>
        </div>
        <div style="background: #020617; padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 11px; color: #94a3b8;">Qualified</div>
            <div id="ev-qualified" style="font-size: 20px; font-weight: 700; color: #34d399;">0</div>
        </div>
        <div style="background: #020617; padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 11px; color: #94a3b8;">Links</div>
            <div id="ev-links" style="font-size: 20px; font-weight: 700; color: #38bdf8;">0</div>
        </div>
        <div style="background: #020617; padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 11px; color: #94a3b8;">Quality Rate</div>
            <div id="ev-quality" style="font-size: 20px; font-weight: 700; color: #a855f7;">0%</div>
        </div>
    </div>
    
    <div id="recent-evidence" style="max-height: 200px; overflow-y: auto;">
        <div class="metric-label">Loading evidence...</div>
    </div>
</div>

<script>
(function() {
    console.log('✅ Evidence Widget Script Initializing...');

    window.loadEvidenceStats = async function() {
        const totalEl = document.getElementById('ev-total');
        if (!totalEl) return; 

        function safeSet(id, value) {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
        }
        
        try {
            const res = await fetch('/api/v1/ingestion/stats');
            if (!res.ok) return;
            const data = await res.json();
            
            safeSet('ev-total', data.total_evidence_blocks || 0);
            safeSet('ev-qualified', data.qualified_evidence || 0);
            safeSet('ev-links', data.total_links || 0);
            safeSet('ev-quality', ((data.quality_rate || 0) * 100).toFixed(0) + '%');
            safeSet('evidence-count', data.total_evidence_blocks || 0);
            
            const blocksRes = await fetch('/api/v1/ingestion/blocks?limit=5');
            const blocksData = await blocksRes.json();
            
            const container = document.getElementById('recent-evidence');
            if (container && blocksData.blocks) {
                container.innerHTML = blocksData.blocks.map(b => `
                    <div style="padding: 8px 0; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1;">
                            <div style="font-size: 12px; color: #f1f5f9;">
                                ${b.content}
                                <span class="tag ${b.is_qualified ? 'tag-success' : 'tag-warning'}" style="font-size: 9px; padding: 1px 6px; margin-left: 6px;">
                                    ${b.is_qualified ? '✓ QUALIFIED' : 'PENDING'}
                                </span>
                            </div>
                            <div style="font-size: 10px; color: #64748b; margin-top: 2px;">
                                Source: ${b.source} | Confidence: ${(b.confidence * 100).toFixed(0)}%
                            </div>
                        </div>
                        <button class="btn" style="padding: 2px 8px; font-size: 9px; background: #1e293b;" onclick="window.viewEvidence(${b.id})">
                            <i class="fas fa-link"></i>
                        </button>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error('Evidence stats error:', e);
        }
    }

    window.viewEvidence = function(evidenceId) {
        window.open(`/api/v1/ingestion/evidence/${evidenceId}`, '_blank');
    }

    window.uploadEvidence = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.txt,.docx';
        input.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            if (typeof showToast === 'function') showToast('📤 Uploading ' + file.name + '...', 'info');
            
            try {
                const res = await fetch('/api/v1/ingestion/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (res.ok) {
                    if (typeof showToast === 'function') showToast(`✅ Uploaded ${data.total_blocks} evidence blocks`, 'success');
                    window.loadEvidenceStats();
                } else {
                    if (typeof showToast === 'function') showToast('❌ Upload failed: ' + data.detail, 'error');
                }
            } catch (e) {
                if (typeof showToast === 'function') showToast('❌ Error: ' + e.message, 'error');
            }
        };
        input.click();
    }
    
    // Crucial: Automatically load stats on injection
    window.loadEvidenceStats();
    console.log('✅ Evidence Widget Script Loaded, Bound, and Initialized');
})();
</script>
