<div id="learning-dashboard-tab">
    <h2 style="color: var(--accent);">📊 Learning Dashboard</h2>
    
    <!-- Stats Grid -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px;">
        <div class="card">
            <div class="metric-label">📈 Learning Rate</div>
            <div class="metric-value" id="learning-rate">0.00</div>
            <span style="color: #34d399; font-size: 12px;">▲ 12% improvement</span>
        </div>
        <div class="card">
            <div class="metric-label">🧠 Patterns Learned</div>
            <div class="metric-value" id="total-patterns">0</div>
            <span style="color: #94a3b8; font-size: 12px;">Active: <span id="active-patterns">0</span></span>
        </div>
        <div class="card">
            <div class="metric-label">🎯 Success Rate</div>
            <div class="metric-value" id="success-rate">0%</div>
            <span style="color: #fbbf24; font-size: 12px;">Based on pattern performance</span>
        </div>
        <div class="card">
            <div class="metric-label">⚡ Consolidation</div>
            <div class="metric-value" id="consolidation-progress">0%</div>
            <div style="width: 100%; height: 6px; background: #1e293b; border-radius: 3px; margin-top: 8px; overflow: hidden;">
                <div id="consolidation-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #34d399); transition: width 0.5s;"></div>
            </div>
        </div>
    </div>
    
    <!-- Consolidation Stats -->
    <div class="card" style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h3 class="card-title" style="margin: 0;">🔄 Consolidation Stats</h3>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-sm" style="background: #34d399; color: #0f172a;" onclick="triggerConsolidation()">
                    <i class="fas fa-play"></i> Run Consolidation
                </button>
                <button class="btn btn-sm" style="background: #1e293b;" onclick="loadConsolidationStats()">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px;">
            <div>
                <div style="color: #94a3b8; font-size: 12px;">Total Episodic Entries</div>
                <div style="color: #f1f5f9; font-size: 20px; font-weight: 600;" id="consolidation-total">0</div>
            </div>
            <div>
                <div style="color: #94a3b8; font-size: 12px;">Pending Consolidation</div>
                <div style="color: #fbbf24; font-size: 20px; font-weight: 600;" id="consolidation-pending">0</div>
            </div>
            <div>
                <div style="color: #94a3b8; font-size: 12px;">Total Patterns</div>
                <div style="color: #34d399; font-size: 20px; font-weight: 600;" id="consolidation-patterns">0</div>
            </div>
        </div>
    </div>
    
    <!-- Pattern Feed -->
    <div class="card">
        <h3 class="card-title">🔄 Recent Patterns</h3>
        <div id="pattern-feed" style="max-height: 300px; overflow-y: auto;">
            <div class="metric-label" style="padding: 10px;">No patterns yet</div>
        </div>
    </div>
</div>

<script>
async function loadLearningStats() {
    try {
        const res = await fetch('/api/v1/admin/dashboard/learning/stats');
        const data = await res.json();
        document.getElementById('learning-rate').textContent = data.improvement_rate || '0.00';
        document.getElementById('total-patterns').textContent = data.total_patterns || 0;
        document.getElementById('active-patterns').textContent = data.active_patterns || 0;
        const successRate = data.total_patterns > 0 ? 
            (data.success_patterns / data.total_patterns * 100).toFixed(1) : 0;
        document.getElementById('success-rate').textContent = successRate + '%';
    } catch(e) { console.error('Error loading learning stats:', e); }
}

async function loadConsolidationStats() {
    try {
        const res = await fetch('/api/v1/admin/dashboard/learning/consolidation/stats');
        const data = await res.json();
        document.getElementById('consolidation-total').textContent = data.total_episodic_entries || 0;
        document.getElementById('consolidation-pending').textContent = data.pending_consolidation || 0;
        document.getElementById('consolidation-patterns').textContent = data.total_patterns || 0;
        const progress = data.total_episodic_entries > 0 ?
            ((data.total_episodic_entries - data.pending_consolidation) / data.total_episodic_entries * 100) : 0;
        document.getElementById('consolidation-progress').textContent = progress.toFixed(1) + '%';
        document.getElementById('consolidation-bar').style.width = progress + '%';
        
        // Update pattern feed
        const feed = document.getElementById('pattern-feed');
        if (data.recent_consolidated && data.recent_consolidated.length > 0) {
            feed.innerHTML = data.recent_consolidated.map(entry => `
                <div style="padding: 8px 0; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #f1f5f9;">${entry.query || 'Unknown pattern'}</span>
                    <span style="color: #64748b; font-size: 11px;">${new Date(entry.timestamp).toLocaleString()}</span>
                </div>
            `).join('');
        } else {
            feed.innerHTML = '<div class="metric-label" style="padding: 10px;">No recent consolidations</div>';
        }
    } catch(e) { console.error('Error loading consolidation stats:', e); }
}

// Auto-refresh
document.addEventListener('DOMContentLoaded', function() {
    loadLearningStats();
    loadConsolidationStats();
    setInterval(loadConsolidationStats, 30000);
});
</script>
