
<div id="documents-tab">
    <h2 style="color: var(--accent);">📄 Documents</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Upload and manage documents. Documents are indexed and searchable by the AI.
    </p>

    <div class="card" style="border-top: 4px solid #34d399; margin-bottom: 20px;">
        <h3 class="card-title">📤 Upload Document</h3>
        <p style="color: #94a3b8; font-size: 13px;">Supported formats: PDF, Word, Excel, Text, Markdown, CSV</p>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="file" id="doc-file-input" accept=".pdf,.docx,.doc,.xlsx,.xls,.txt,.md,.csv" class="input-field" style="flex: 1;">
            <button class="btn" onclick="uploadDocument()" style="background: #34d399; color: #0f172a;">
                <i class="fas fa-upload"></i> Upload
            </button>
        </div>
        <div id="upload-status" style="margin-top: 10px; font-size: 12px; color: #fbbf24;"></div>
    </div>

    <div class="card">
        <h3 class="card-title">📚 My Documents</h3>
        <div id="documents-list">
            <div class="metric-label">Loading documents...</div>
        </div>
    </div>
</div>

<script>
async function uploadDocument() {
    const input = document.getElementById('doc-file-input');
    const status = document.getElementById('upload-status');
    const file = input?.files?.[0];
    
    if (!file) {
        showToast('Select a file first', 'error');
        return;
    }
    
    status.textContent = '⏳ Uploading ' + file.name + '...';
    status.style.color = '#fbbf24';
    
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const res = await fetch('/api/v1/documents/upload', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (res.ok) {
            status.textContent = '✅ ' + data.message;
            status.style.color = '#34d399';
            showToast('Document uploaded successfully!', 'success');
            input.value = '';
            loadDocuments();
        } else {
            status.textContent = '❌ ' + (data.detail || 'Upload failed');
            status.style.color = '#f87171';
            showToast('Upload failed: ' + (data.detail || 'Unknown error'), 'error');
        }
    } catch (e) {
        status.textContent = '❌ ' + e.message;
        status.style.color = '#f87171';
        showToast('Network error: ' + e.message, 'error');
    }
}

async function loadDocuments() {
    const list = document.getElementById('documents-list');
    if (!list) return;
    
    list.innerHTML = '<div class="metric-label">Loading...</div>';
    
    try {
        const res = await fetch('/api/v1/documents/list');
        const data = await res.json();
        
        if (data.documents && data.documents.length > 0) {
            list.innerHTML = data.documents.map(d => `
                <div style="display:flex; justify-content:space-between; padding:12px; background:#020617; border-radius:8px; border:1px solid #334155; align-items:center; margin-bottom:8px;">
                    <div style="flex:1;">
                        <div style="font-weight:700;color:#38bdf8;">${d.title}</div>
                        <div style="font-size:11px;color:#64748b;">
                            Type: ${d.file_type || 'unknown'} | Size: ${(d.file_size/1024).toFixed(1)} KB
                        </div>
                        <div style="font-size:11px;color:#94a3b8;margin-top:4px;">${d.content_preview}</div>
                    </div>
                    <button class="refresh-btn" style="color:#f87171;border-color:#f87171;padding:4px 10px;font-size:11px;" onclick="deleteDocument(${d.id})">
                        Delete
                    </button>
                </div>
            `).join('');
        } else {
            list.innerHTML = '<div class="metric-label">No documents uploaded yet.</div>';
        }
    } catch (e) {
        list.innerHTML = '<div class="metric-label" style="color:#f87171;">Error loading documents</div>';
        console.error('Document load error:', e);
    }
}

async function deleteDocument(id) {
    if (!confirm('Delete this document?')) return;
    
    try {
        const res = await fetch(`/api/v1/documents/${id}`, { method: 'DELETE' });
        if (res.ok) {
            showToast('Document deleted', 'info');
            loadDocuments();
        } else {
            showToast('Delete failed', 'error');
        }
    } catch (e) {
        showToast('Error: ' + e.message, 'error');
    }
}

// Load on tab switch
if (document.getElementById('documents-tab')) {
    loadDocuments();
}
</script>
