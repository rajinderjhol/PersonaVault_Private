<!-- Compression Metrics Section for Decision Dashboard -->
<div class="card" style="border-top: 4px solid #a855f7; margin-top: 20px;">
    <h3 class="card-title">🧠 Intelligence Compression</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
        <div>
            <div class="metric-label">Compression Ratio</div>
            <div id="di-compression-ratio" class="metric-value" style="font-size: 24px; color: #a855f7;">0:1</div>
            <div style="font-size: 10px; color: #64748b;">Target: 10,000:1</div>
        </div>
        <div>
            <div class="metric-label">Patterns Learned</div>
            <div id="di-patterns-count" class="metric-value" style="font-size: 24px; color: #38bdf8;">0</div>
        </div>
        <div>
            <div class="metric-label">Active Patterns</div>
            <div id="di-active-patterns" class="metric-value" style="font-size: 24px; color: #34d399;">0</div>
        </div>
        <div>
            <div class="metric-label">Avg Confidence</div>
            <div id="di-avg-weight" class="metric-value" style="font-size: 24px; color: #fbbf24;">0.00</div>
        </div>
    </div>
</div>
