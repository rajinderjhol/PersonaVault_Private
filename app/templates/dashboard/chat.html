{% extends "base.html" %}

{% block title %}PersonaVault - Sovereign Workbench{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/chat-premium.css">

<div class="chat-premium" id="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <span class="icon">📦</span>
                <span class="name">PV Control</span>
            </div>
            <button class="toggle-btn" onclick="layoutManager.toggleSidebar()">◀</button>
        </div>
        <div class="sidebar-nav"></div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <div class="name">User</div>
                    <div class="role">Admin</div>
                </div>
            </div>
            <button class="toggle-btn" onclick="layoutManager.showTabCustomizer()">⚙️</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="messages-container" id="messages-container">
        <!-- Messages will be injected by JavaScript -->
    </div>

    <!-- Intelligence Panel -->
    <div class="intelligence-panel">
        <!-- Content will be injected by JavaScript -->
    </div>
</div>

<script src="/static/js/layout-manager.js"></script>
<script src="/static/js/chat-premium.js"></script>
{% endblock %}
