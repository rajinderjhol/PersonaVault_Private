<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonaVault Intelligence Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/v2/v2_dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar" id="main-sidebar">
            <div class="brand">
                <span class="logo-icon">🛡️</span>
                <span class="brand-text">PersonaVault</span>
            </div>
            <nav id="sidebar-nav"></nav>
            <div class="sidebar-section">
                <div class="section-header">
                    <span>💬 Chat History</span>
                    <button class="btn-action" onclick="window.chatIntegration?.newChat()">+ New</button>
                </div>
                <div id="session-list" class="session-list">
                    <div class="session-loading">Sessions will appear here</div>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-avatar">👤</span>
                    <span>Admin</span>
                </div>
            </div>
        </aside>

        <main class="chat-panel">
            <header>
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h2>Command Center</h2>
            </header>
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-title">
                        <span class="chat-icon">💬</span>
                        <span class="chat-title-text">PersonaVault Chat</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="btn-new-chat" onclick="window.chatIntegration?.newChat()">+ New Chat</button>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-empty">
                        <div class="empty-icon">👋</div>
                        <h3>Welcome to PersonaVault!</h3>
                        <p>Start a new conversation to begin.</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <textarea id="chat-input" placeholder="Ask me anything..." rows="1"></textarea>
                        <div class="chat-actions">
                            <button class="btn-attach">📎</button>
                            <button class="send-btn" id="send-btn">➤</button>
                        </div>
                    </div>
                    <div class="chat-controls">
                        <label class="control-toggle">
                            <input type="checkbox" id="thought-toggle"> Show thought process
                        </label>
                        <select id="provider-select" class="provider-select">
                            <option value="groq">Groq</option>
                            <option value="ollama">Ollama</option>
                            <option value="gemini">Gemini</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>

        <section class="context-panel">
            <div class="right-sidebar">
                <div class="context-section">
                    <h4 class="context-title">🔍 Current Decision</h4>
                    <div id="context-decision"></div>
                </div>
                <div class="context-section">
                    <h4 class="context-title">📊 Memory Phases</h4>
                    <div id="thermo-distribution"></div>
                </div>
                <div class="context-section">
                    <h4 class="context-title">🔄 Recent Transitions</h4>
                    <div id="thermo-transitions"></div>
                </div>
            </div>
        </section>

        <div id="sidebar-editor" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>✏️ Customize Sidebar</h3>
                    <button onclick="closeSidebarEditor()">×</button>
                </div>
                <div class="modal-body">
                    <div class="element-grid">
                        <button class="element-btn" onclick="window.sidebarManager?.addElement('domain', 'Security')">🔒 Security</button>
                        <button class="element-btn" onclick="window.sidebarManager?.addElement('domain', 'Compliance')">⚖️ Compliance</button>
                        <button class="element-btn" onclick="window.sidebarManager?.addElement('domain', 'Contract')">📄 Contract</button>
                        <button class="element-btn" onclick="window.sidebarManager?.addElement('domain', 'Procurement')">📦 Procurement</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SINGLE COMBINED JS FILE -->
    <script src="/static/js/three_panel/personavault.js"></script>
</body>
</html>

    <!-- PersonaVault Dashboard JavaScript -->
    <script src="/static/js/three_panel/personavault.js"></script>
</body>
</html>
