<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonaVault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 200px; background: #0f172a; color: #94a3b8; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .sidebar .brand { color: white; padding: 16px 20px; border-bottom: 1px solid #1e293b; font-weight: 700; font-size: 16px; }
        .sidebar .nav { flex: 1; padding: 8px; }
        .sidebar .nav-item { display: block; padding: 8px 12px; border-radius: 6px; color: #94a3b8; text-decoration: none; cursor: pointer; margin-bottom: 2px; }
        .sidebar .nav-item:hover, .sidebar .nav-item.active { background: #1e293b; color: white; }
        .sidebar .footer { padding: 12px 16px; border-top: 1px solid #1e293b; font-size: 12px; }
        
        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        .main header { padding: 12px 20px; border-bottom: 1px solid #e2e8f0; background: #fafafa; }
        .main header h2 { font-size: 16px; }
        
        /* Chat */
        .chat-area { flex: 1; display: flex; flex-direction: column; padding: 0 20px 20px; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px 0; }
        .message { margin-bottom: 8px; max-width: 80%; }
        .message.user { margin-left: auto; }
        .message .content { padding: 8px 14px; border-radius: 12px; font-size: 14px; }
        .message.user .content { background: #3b82f6; color: white; }
        .message.assistant .content { background: #f1f5f9; }
        
        .chat-input { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid #e2e8f0; background: #fafafa; }
        .chat-input textarea { flex: 1; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; resize: none; font-family: inherit; }
        .chat-input button { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        /* Context */
        .context { width: 260px; background: #f8fafc; border-left: 1px solid #e2e8f0; padding: 16px; overflow-y: auto; }
        .context-section { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
        .context-section .title { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
        
        .phase-bar { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; }
        .phase-bar .track { flex: 1; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
        .phase-bar .fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .phase-bar.gas .fill { background: #94a3b8; }
        .phase-bar.liquid .fill { background: #60a5fa; }
        .phase-bar.ice .fill { background: #34d399; }
        .phase-bar.snowflake .fill { background: #f472b6; }
        
        .empty { color: #94a3b8; font-size: 12px; padding: 6px 0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">🛡️ PersonaVault</div>
        <div class="nav">
            <div class="nav-item active">📊 Dashboard</div>
            <div class="nav-item">💬 Chat</div>
            <div class="nav-item" onclick="window.location.href='/admin/swarm'">🐝 Swarm</div>
            <div class="nav-item" onclick="window.location.href='/admin/compliance'">⚖️ Compliance</div>
            <div class="nav-item" onclick="window.location.href='/admin/security'">🔒 Security</div>
        </div>
        <div class="footer">👤 Admin</div>
    </div>

    <div class="main">
        <header><h2>Command Center</h2></header>
        <div class="chat-area">
            <div class="chat-messages" id="messages">
                <div style="text-align:center;color:#94a3b8;padding:30px;">
                    <div style="font-size:40px;">👋</div>
                    <h3 style="color:#0f172a;">Welcome to PersonaVault!</h3>
                    <p>Start a new conversation to begin.</p>
                </div>
            </div>
            <div class="chat-input">
                <textarea id="input" rows="1" placeholder="Ask me anything..."></textarea>
                <button id="send">➤</button>
            </div>
        </div>
    </div>

    <div class="context">
        <div class="context-section">
            <div class="title">🔍 Current Decision</div>
            <div id="decision"><div class="empty">No active decision</div></div>
        </div>
        <div class="context-section">
            <div class="title">📊 Memory Phases</div>
            <div id="phases"><div class="empty">Loading...</div></div>
        </div>
        <div class="context-section">
            <div class="title">🔄 Recent Transitions</div>
            <div id="transitions"><div class="empty">No recent transitions</div></div>
        </div>
    </div>

    <script>
    // ============================================
    // COMPLETE WORKING DASHBOARD
    // ============================================
    (function() {
        console.log('🚀 Dashboard loading...');

        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        function addMessage(role, content) {
            const empty = messages.querySelector('.empty-state');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="content">${content}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing';
            div.innerHTML = `<div class="content">⏳ Thinking...</div>`;
            messages.appendChild(div);
        }

        function hideTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            input.value = '';
            showTyping();

            try {
                const res = await fetch('/api/v1/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ query: text })
                });
                hideTyping();
                const data = await res.json();
                addMessage('assistant', data.response || 'No response');
            } catch (e) {
                hideTyping();
                addMessage('assistant', '❌ Error');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        // Load context
        async function loadPhases() {
            try {
                const res = await fetch('/api/v1/thermodynamics/phase-distribution', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    const total = (data.gas||0) + (data.liquid||0) + (data.ice||0) + (data.snowflakes||0) || 1;
                    const phases = [
                        { id: 'gas', label: 'Gas', icon: '💨', count: data.gas||0 },
                        { id: 'liquid', label: 'Liquid', icon: '💧', count: data.liquid||0 },
                        { id: 'ice', label: 'Ice', icon: '🧊', count: data.ice||0 },
                        { id: 'snowflake', label: 'Snowflakes', icon: '❄️', count: data.snowflakes||0 }
                    ];
                    document.getElementById('phases').innerHTML = phases.map(p => `
                        <div class="phase-bar ${p.id}">
                            <span>${p.icon}</span>
                            <span>${p.label}</span>
                            <span class="track"><span class="fill" style="width:${Math.max((p.count/total)*100, 0.5)}%"></span></span>
                            <span>${p.count}</span>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        async function loadDecision() {
            try {
                const res = await fetch('/api/v1/thermodynamics/current-decision', { credentials: 'include' });
                if (res.ok) {
                    const d = await res.json();
                    if (d && d.step) {
                        document.getElementById('decision').innerHTML = `
                            <div style="background:white;padding:10px;border-radius:6px;border:1px solid #e2e8f0;">
                                <div style="display:flex;justify-content:space-between;">
                                    <span style="font-weight:600;font-size:12px;padding:2px 8px;border-radius:8px;background:#dbeafe;color:#1d4ed8;">${d.step}</span>
                                    <span style="font-weight:700;color:#10b981;">${d.confidence||0}%</span>
                                </div>
                                <div style="font-size:11px;color:#64748b;margin-top:4px;">Agent: ${d.agent||'Unknown'}</div>
                            </div>
                        `;
                    }
                }
            } catch(e) {}
        }

        async function loadTransitions() {
            try {
                const res = await fetch('/api/v1/thermodynamics/transitions?limit=5', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        document.getElementById('transitions').innerHTML = data.map(t => `
                            <div style="padding:4px 8px;background:white;border-radius:4px;margin-bottom:3px;font-size:11px;display:flex;justify-content:space-between;border-left:2px solid #94a3b8;">
                                <span>🔄 ${t.description || t.type}</span>
                                <span style="color:#94a3b8;">${t.timestamp ? new Date(t.timestamp).toLocaleTimeString() : ''}</span>
                            </div>
                        `).join('');
                    }
                }
            } catch(e) {}
        }

        loadPhases();
        loadDecision();
        loadTransitions();
        setInterval(() => { loadPhases(); loadDecision(); loadTransitions(); }, 15000);

        console.log('✅ Dashboard ready');
    })();
    </script>
</body>
</html>
