{% extends "base.html" %}

{% block title %}Layout Test Suite - PersonaVault{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/chat-premium.css">

<div class="chat-premium" id="chat-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand"><span>📦</span><span>PV Control</span></div>
            <button class="toggle-btn" onclick="layoutManager.toggleSidebar()">◀</button>
        </div>
        <div class="sidebar-nav"></div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">U</div>
            </div>
            <button class="toggle-btn" onclick="layoutManager.showTabCustomizer()">⚙️</button>
        </div>
    </div>
    <div class="messages-container" id="messages-container">
        <h1>Layout Verification</h1>
        <div id="test-results"></div>
    </div>
    <div class="intelligence-panel">
    </div>
</div>

<script src="/static/js/layout-manager.js"></script>
<script src="/static/js/test_layout.js"></script>
{% endblock %}
